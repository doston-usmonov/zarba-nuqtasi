services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zarba
      POSTGRES_USER: zarba
      # .env faylidan; ./deploy/deploy.sh birinchi ishga tushganda uni tasodifiy parol bilan o'zi yaratadi
      POSTGRES_PASSWORD: ${ZARBA_DB_PASSWORD:?.env faylida ZARBA_DB_PASSWORD yo'q — ./deploy/deploy.sh ni ishga tushiring}
    volumes:
      - zarba-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarba -d zarba"]
      interval: 3s
      timeout: 3s
      retries: 40
    # port tashqariga ochilmaydi: bazaga faqat shu compose ichidagi xizmatlar ulanadi

  # kunlik zaxira nusxa (pg_dump), oxirgi 7 kun saqlanadi
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: zarba
      PGDATABASE: zarba
      PGPASSWORD: ${ZARBA_DB_PASSWORD}
    volumes:
      - zarba-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/zarba-$$(date +%F).sql.gz
          if pg_dump --no-owner | gzip > $$f.tmp; then mv $$f.tmp $$f; echo "zaxira: $$f"; else rm -f $$f.tmp; echo "zaxira olinmadi" >&2; fi
          find /backups -name 'zarba-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done

  zarba:
    # GitHub Actions har push'da yig'adigan image; lokal yig'ish uchun: docker compose up -d --build
    image: ghcr.io/doston-usmonov/zarba-nuqtasi:latest
    build: .
    container_name: zarba-nuqtasi
    restart: unless-stopped
    depends_on:
      - db   # baza tayyor bo'lmasa ham o'yin ishga tushadi va bazani o'zi kutadi
    # Faqat lokal portga ochiladi: tashqariga Nginx orqali chiqariladi.
    # Nginx'siz sinab ko'rish uchun "127.0.0.1:8080:8080" o'rniga "8080:8080" yozing.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAX_PLAYERS: "64"      # bitta xonadagi o'yinchilar (botlar bilan) yuqori chegarasi; xona egasi kamroq qo'yishi mumkin
      ALLOWED_ORIGINS: ""    # bo'sh — faqat o'z domeningiz; "*" — hamma joydan
      DATABASE_URL: postgres://zarba:${ZARBA_DB_PASSWORD}@db:5432/zarba?sslmode=disable
      DATA_DIR: /data        # oldingi versiyaning fayl bazasi: birinchi ishga tushishda Postgres'ga import qilinadi
      TURN_SECRET: ${ZARBA_TURN_SECRET:-}   # ovozli chat uchun TURN (pastdagi "turn" xizmati bilan bir xil)
      TURN_PORT: "3478"
    volumes:
      - zarba-data:/data

  # Ovozli chat uchun TURN server: o'yinchilar to'g'ridan-to'g'ri ulana olmasa (mobil internet, NAT),
  # ovoz shu server orqali o'tadi. Faqat vaqtinchalik login-parol bilan ishlaydi (o'yin serveri beradi).
  # Firewall'da ochish kerak: 3478/udp, 3478/tcp va 49160-49200/udp (README → Ovozli chat).
  turn:
    image: coturn/coturn:4.18
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${ZARBA_TURN_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then echo "ZARBA_TURN_SECRET yo'q: ./deploy/deploy.sh ni ishga tushiring"; exec sleep infinity; fi
        exec turnserver -n --log-file=stdout --listening-port=3478 --min-port=49160 --max-port=49200 \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm=zarba --fingerprint \
          --no-cli --no-tls --no-dtls --no-multicast-peers --stale-nonce=600 --user-quota=12 --total-quota=300 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  zarba-pg:
  zarba-backups:
  zarba-data:
