name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zarba
          POSTGRES_PASSWORD: zarba
          POSTGRES_DB: zarba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zarba"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ZARBA_TEST_DATABASE_URL: postgres://zarba:zarba@localhost:5432/zarba_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Tekshiruv (gofmt, vet, testlar, build)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
          go build ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Serverni yangilash
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          fail(){ echo "::error title=Deploy::$1"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1 || fail "DEPLOY_SSH_KEY yaroqsiz: ~/.ssh/zarba_deploy faylining to'liq matni (BEGIN/END qatorlari bilan) kerak, .pub emas"
          [ -n "$DEPLOY_USER" ] || fail "DEPLOY_USER secret bo'sh"
          PORT="${DEPLOY_PORT:-22}"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -p "$PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] || fail "$DEPLOY_HOST:$PORT ga ulanib bo'lmadi: SSH porti tashqaridan yopiq (firewall) yoki DEPLOY_HOST/DEPLOY_PORT noto'g'ri"
          fi
          # serverdagi kalit faqat deploy/deploy.sh ni ishga tushira oladi (authorized_keys: command=...)
          set +e
          out=$(ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" deploy 2>&1); code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            why=$(printf '%s\n' "$out" | grep -m1 -E "Permission denied|Connection refused|timed out|Could not resolve|Host key verification|No such file|not found|Permission|docker|healthz|javob" || printf '%s\n' "$out" | tail -n1)
            fail "ssh chiqish kodi $code: $why"
          fi

      - name: Deploy sozlanmagan
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret qo'shilmagan, avtomatik deploy o'tkazib yuborildi (README → Avtomatik deploy)"
