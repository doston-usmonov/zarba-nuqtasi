# /etc/nginx/sites-available/zarba  (oyin.example.uz o'rniga o'z domeningizni yozing)
# Sertifikat: sudo certbot --nginx -d oyin.example.uz

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name oyin.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oyin.example.uz;

    ssl_certificate     /etc/letsencrypt/live/oyin.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyin.example.uz/privkey.pem;

    # o'yinchilar o'rtasidagi aloqa (WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # o'yinning o'zi
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        gzip on;
        gzip_types text/html application/javascript;
    }
}
